<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Traslados Ejecutivos - JCLL C.A. (Cloud)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // ==========================================
        // NUEVA URL DE NPOINT.IO CONFIGURADA
        // ==========================================
        const NPOINT_URL = "https://api.npoint.io/b3e83f2b33f5ffe0e6cc";

        async function cloudSaveReport() {
            const reportName = prompt("Nombre del reporte (Ej: Servicios_Juan_12_Oct):", "Reporte_" + new Date().toISOString().split('T')[0]);
            if (!reportName) return;

            const excelBase64 = generateWorkbookData();
            if (!excelBase64) return;

            const newReport = {
                id: 'rep_' + Date.now(),
                name: reportName,
                date: new Date().toLocaleString(),
                fileBase64: excelBase64
            };

            try {
                const getRes = await fetch(NPOINT_URL);
                let currentData = await getRes.json();
                
                if (!currentData.reports) {
                    currentData = { reports: [] };
                }

                currentData.reports.unshift(newReport);

                const postRes = await fetch(NPOINT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentData)
                });

                if (postRes.ok) {
                    alert("¡Reporte guardado exitosamente en la nube!");
                } else {
                    alert("Error al guardar en la nube.");
                }
            } catch (e) {
                console.error(e);
                alert("Error de red al conectar con npoint.io.");
            }
        }

        async function cloudFetchReports() {
            const listContainer = document.getElementById("cloud-reports-list");
            listContainer.innerHTML = '<div class="text-center py-6 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Cargando reportes desde la nube...</p></div>';
            
            try {
                const res = await fetch(NPOINT_URL);
                const data = await res.json();
                
                if (!data.reports || data.reports.length === 0) {
                    listContainer.innerHTML = '<p class="text-center py-6 text-slate-500">No hay reportes guardados en la nube todavía.</p>';
                    return;
                }

                let html = '';
                data.reports.forEach((rep) => {
                    html += `
                        <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-white text-sm sm:text-base">${rep.name}</h4>
                                <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i> ${rep.date}</span>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                                <button onclick="downloadCloudFile('${rep.name}', '${rep.fileBase64}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5 shadow">
                                    <i class="fa-solid fa-download"></i> Descargar
                                </button>
                                <button onclick="cloudDeleteReport('${rep.id}')" class="bg-rose-600/20 hover:bg-rose-600 border border-rose-500/40 text-rose-300 hover:text-white p-2 rounded-xl text-xs transition flex items-center justify-center shadow" title="Eliminar reporte">
                                    <i class="fa-solid fa-xmark text-base px-1"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (e) {
                console.error(e);
                listContainer.innerHTML = '<p class="text-center py-6 text-rose-400">Error al conectar con la nube.</p>';
            }
        }

        async function cloudDeleteReport(reportId) {
            if (!confirm("¿Estás seguro de eliminar este reporte de la nube?")) return;

            try {
                const res = await fetch(NPOINT_URL);
                let data = await res.json();

                if (data.reports) {
                    data.reports = data.reports.filter(r => r.id !== reportId);

                    const postRes = await fetch(NPOINT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (postRes.ok) {
                        cloudFetchReports();
                    } else {
                        alert("Error al eliminar el reporte.");
                    }
                }
            } catch (e) {
                console.error(e);
                alert("Error de red al intentar eliminar.");
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card-service { background: #1e293b; border: 1px solid #334155; }
        input, select { background-color: #0f172a !important; color: #f8fafc !important; border-color: #475569 !important; }
        input:focus, select:focus { border-color: #3b82f6 !important; ring-color: #3b82f6 !important; }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="w-full sm:w-auto flex justify-center sm:justify-start items-center">
                <!-- Logo con Contenedor Blanco -->
                <div class="w-full max-w-[320px] h-24 sm:h-28 rounded-2xl bg-white border-2 border-blue-500/50 flex items-center justify-center overflow-hidden shadow-lg p-1.5">
                    <img src="https://cdn.phototourl.com/member/2026-10-12-5c3f04b0-7150-4818-853b-480200ff6fd8.jpg" class="w-full h-full object-contain" alt="Logo JCLL C.A.">
                </div>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                <button onclick="addServiceRow()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-plus"></i> Añadir Servicio
                </button>
                <button onclick="openCloudModal()" class="flex-1 sm:flex-none bg-purple-600 hover:bg-purple-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2 shadow" title="Ver archivos en la nube">
                    <i class="fa-solid fa-cloud-arrow-down text-lg"></i> ⬇️ Nube
                </button>
                <button onclick="cloudSaveReport()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Guardar en Nube
                </button>
            </div>
        </header>

        <!-- Summary Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
            <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl">
                <span class="text-xs text-slate-400 block font-medium">Total Servicios</span>
                <span id="total-services-count" class="text-xl font-bold text-white">0</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl">
                <span class="text-xs text-slate-400 block font-medium">Monto Acumulado</span>
                <span id="total-revenue" class="text-xl font-bold text-emerald-400">$0.00</span>
            </div>
            <div class="col-span-2 sm:col-span-1 bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex items-center justify-between sm:justify-start gap-4">
                <div>
                    <span class="text-xs text-slate-400 block font-medium">Espera / Hora</span>
                    <span class="text-sm font-semibold text-blue-300">$9.00 USD</span>
                </div>
                <div class="text-right sm:text-left">
                    <span class="text-xs text-slate-400 block font-medium">Nocturno</span>
                    <span class="text-sm font-semibold text-amber-300">+20%</span>
                </div>
            </div>
        </div>

        <!-- Services Container -->
        <div id="services-container" class="space-y-4 mb-8"></div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-12 bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl mb-8">
            <i class="fa-solid fa-clipboard-list text-4xl text-slate-600 mb-3"></i>
            <h3 class="text-base font-medium text-slate-300">No hay servicios registrados</h3>
            <p class="text-xs text-slate-500 mt-1">Presiona "Añadir Servicio" para comenzar.</p>
        </div>

        <!-- Footer actions -->
        <div class="flex justify-center">
            <button onclick="addServiceRow()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 px-6 py-3 rounded-xl font-medium text-sm transition flex items-center gap-2 shadow">
                <i class="fa-solid fa-plus text-blue-400"></i> Añadir otro servicio
            </button>
        </div>
    </div>

    <!-- Modal para ver archivos en la Nube -->
    <div id="cloud-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cloud text-purple-400"></i> Reportes en la Nube (JCLL C.A.)
                </h3>
                <button onclick="closeCloudModal()" class="text-slate-400 hover:text-white text-xl p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Selecciona el reporte guardado que deseas descargar o eliminar:</p>
            
            <div id="cloud-reports-list" class="space-y-3 overflow-y-auto flex-1 pr-1">
                <!-- Se llena dinámicamente -->
            </div>

            <div class="mt-6 pt-3 border-t border-slate-700 text-right">
                <button onclick="closeCloudModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Template for Service Card -->
    <template id="service-template">
        <div class="card-service rounded-2xl p-4 sm:p-5 shadow-md relative transition-all">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700/80">
                <span class="service-badge text-xs font-semibold px-2.5 py-1 rounded-lg bg-blue-500/20 text-blue-300 border border-blue-500/30">
                    Servicio #<span class="service-index">1</span>
                </span>
                <button type="button" onclick="removeServiceRow(this)" class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-rose-500/10 transition text-sm flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Eliminar</span>
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                <!-- Fecha -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fecha (DD/MM/AAAA)</label>
                    <input type="date" class="service-date w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" onchange="calculateRow(this)">
                </div>

                <!-- Pasajeros -->
                <div class="sm:col-span-1 lg:col-span-2">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Pasajero(s) <span class="text-[10px] text-slate-500">(Máx. 4, separados por , . /)</span></label>
                    <input type="text" class="service-passengers w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" placeholder="Ej: Juan Pérez, María Gómez">
                </div>

                <!-- Origen -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Origen</label>
                    <input type="text" class="service-origin w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" placeholder="Lugar de recogida">
                </div>

                <!-- Destino -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Destino <span class="text-[10px] text-slate-500">(Separados por , . /)</span></label>
                    <input type="text" class="service-destination w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" placeholder="Lugar de llegada">
                </div>

                <!-- Precio Base con Sumas -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Precio Base / Suma ($) <span class="text-[10px] text-blue-400">Ej: 20+30+15</span></label>
                    <input type="text" class="service-price w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" placeholder="0 o 20+30" oninput="calculateRow(this)">
                </div>

                <!-- Tiempo de Espera (Solo Minutos) -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Espera (Minutos) <span class="text-[10px] text-blue-300">Ej: 120 = 2h</span></label>
                    <input type="number" min="0" value="0" class="service-wait-minutes w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" oninput="calculateRow(this)">
                </div>

                <!-- Chofer -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Chofer</label>
                    <input type="text" class="service-driver w-full rounded-xl px-3 py-2 text-sm border focus:outline-none" placeholder="Nombre del chofer">
                </div>
            </div>

            <!-- Bottom Row: Night checkbox & Total calculation -->
            <div class="mt-4 pt-3 border-t border-slate-700/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <label class="flex items-center gap-2.5 cursor-pointer select-none bg-slate-900/50 px-3 py-2 rounded-xl border border-slate-700/60 hover:border-slate-600 transition">
                    <input type="checkbox" class="service-night w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-900 border-slate-700" onchange="calculateRow(this)">
                    <span class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-moon text-amber-400"></i> Servicio Nocturno <span class="text-[10px] text-amber-300/80">(+20%)</span>
                    </span>
                </label>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <span class="text-xs font-medium text-slate-400">Total Servicio:</span>
                    <span class="service-total text-base sm:text-lg font-bold text-emerald-400">$0.00</span>
                </div>
            </div>
        </div>
    </template>

    <script>
        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function formatDateToDDMMYYYY(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return parts[2] + '/' + parts[1] + '/' + parts[0];
            }
            return dateStr;
        }

        function parsePriceExpression(expr) {
            if (!expr) return 0;
            const sanitized = String(expr).replace(/[^0-9+\-*/.]/g, '');
            if (!sanitized) return 0;
            try {
                const result = Function('"use strict";return (' + sanitized + ')')();
                return isNaN(result) ? 0 : parseFloat(result);
            } catch (e) {
                return 0;
            }
        }

        function addServiceRow(data = null) {
            const container = document.getElementById('services-container');
            const emptyState = document.getElementById('empty-state');
            emptyState.style.display = 'none';

            const template = document.getElementById('service-template');
            const clone = template.content.cloneNode(true);

            clone.querySelector('.service-date').value = data ? data.date : getTodayDate();

            container.appendChild(clone);
            updateRowNumbers();
            updateTotals();
        }

        function removeServiceRow(btn) {
            const card = btn.closest('.card-service');
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(() => {
                card.remove();
                updateRowNumbers();
                updateTotals();
                checkEmptyState();
            }, 200);
        }

        function checkEmptyState() {
            const container = document.getElementById('services-container');
            const emptyState = document.getElementById('empty-state');
            if (container.children.length === 0) {
                emptyState.style.display = 'block';
            }
        }

        function updateRowNumbers() {
            const cards = document.querySelectorAll('.card-service');
            cards.forEach((card, index) => {
                card.querySelector('.service-index').textContent = index + 1;
            });
        }

        function calculateRow(element) {
            const card = element.closest('.card-service');
            const priceInputVal = card.querySelector('.service-price').value;
            const basePrice = parsePriceExpression(priceInputVal);
            
            const minutes = parseFloat(card.querySelector('.service-wait-minutes').value) || 0;
            const totalHoursWait = minutes / 60.0;

            const isNight = card.querySelector('.service-night').checked;

            let subtotal = basePrice;
            if (isNight) {
                subtotal *= 1.20;
            }
            const waitingCost = totalHoursWait * 9.0;
            const total = subtotal + waitingCost;

            card.querySelector('.service-total').textContent = '$' + total.toFixed(2);
            updateTotals();
        }

        function updateTotals() {
            const cards = document.querySelectorAll('.card-service');
            let grandTotal = 0;
            cards.forEach(card => {
                const totalText = card.querySelector('.service-total').textContent.replace('$', '');
                grandTotal += parseFloat(totalText) || 0;
            });

            document.getElementById('total-services-count').textContent = cards.length;
            document.getElementById('total-revenue').textContent = '$' + grandTotal.toFixed(2);
        }

        function generateWorkbookData() {
            const cards = document.querySelectorAll('.card-service');
            if (cards.length === 0) {
                alert('No hay servicios registrados.');
                return null;
            }

            const dataToExport = [];
            cards.forEach((card, index) => {
                const rawDate = card.querySelector('.service-date').value;
                const formattedDate = formatDateToDDMMYYYY(rawDate);
                const passengers = card.querySelector('.service-passengers').value;
                const origin = card.querySelector('.service-origin').value;
                const destination = card.querySelector('.service-destination').value;
                const driver = card.querySelector('.service-driver').value;
                
                const priceInputVal = card.querySelector('.service-price').value;
                const basePrice = parsePriceExpression(priceInputVal);

                const minutes = parseFloat(card.querySelector('.service-wait-minutes').value) || 0;
                const totalHoursWait = minutes / 60.0;
                const waitingCost = totalHoursWait * 9.0;

                const isNight = card.querySelector('.service-night').checked;
                
                let subtotal = basePrice;
                if (isNight) subtotal *= 1.20;
                const total = subtotal + waitingCost;

                dataToExport.push({
                    "N°": index + 1,
                    "Fecha": formattedDate,
                    "Pasajero(s)": passengers,
                    "Origen": origin,
                    "Destino": destination,
                    "Precio / Suma Ingresada": priceInputVal,
                    "Precio Base Calculado ($)": basePrice,
                    "Espera (Minutos)": minutes,
                    "Costo Espera ($)": parseFloat(waitingCost.toFixed(2)),
                    "Nocturno (20%)": isNight ? "Sí" : "No",
                    "Total Servicio ($)": parseFloat(total.toFixed(2)),
                    "Chofer": driver
                });
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const colWidths = [
                {wch: 5},  {wch: 14}, {wch: 30}, {wch: 20}, 
                {wch: 20}, {wch: 22}, {wch: 22}, {wch: 16}, 
                {wch: 16}, {wch: 15}, {wch: 18}, {wch: 18}
            ];
            worksheet['!cols'] = colWidths;

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Traslados Ejecutivos");
            
            const excelBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });
            return excelBuffer;
        }

        function openCloudModal() {
            document.getElementById('cloud-modal').classList.remove('hidden');
            cloudFetchReports();
        }

        function closeCloudModal() {
            document.getElementById('cloud-modal').classList.add('hidden');
        }

        window.downloadCloudFile = function(fileName, base64Data) {
            const link = document.createElement('a');
            link.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + base64Data;
            link.download = fileName + '.xlsx';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.addEventListener('DOMContentLoaded', () => {
            addServiceRow();
        });
    </script>
</body>
</html>
